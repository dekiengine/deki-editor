# Check out deki-editor with its deki-engine submodule.
#
# deki-engine is public, and with no deploy key the submodule is fetched over
# plain HTTPS: that is what a pull request from a fork does, since it gets no
# secrets. A private engine (a fork that keeps its own private) is fetched over
# SSH with a read-only deploy key on the engine repository, stored as the
# DEKI_ENGINE_DEPLOY_KEY secret on this one; a workflow's own GITHUB_TOKEN only
# reaches the repository the workflow runs in, so `actions/checkout` with
# `submodules: recursive` cannot. To set it up once:
#
#     ssh-keygen -t ed25519 -N "" -f deki-engine-ci -C "deki-editor CI"
#     gh api repos/dekiengine/deki-engine/keys -f title="deki-editor CI (read-only)" \
#            -f key="$(cat deki-engine-ci.pub)" -F read_only=true
#     gh secret set DEKI_ENGINE_DEPLOY_KEY --repo dekiengine/deki-editor < deki-engine-ci
#     rm deki-engine-ci deki-engine-ci.pub


name: Checkout with engine
description: actions/checkout plus the deki-engine submodule (over HTTPS, or a deploy key for a private engine)

inputs:
  ref:
    description: "Ref to check out (default: the workflow's ref)"
    required: false
    default: ''
  deploy-key:
    description: Private SSH key with read access to dekiengine/deki-engine; empty for a public engine
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref }}
        submodules: false

    # Pinned to a commit, not the tag: this step receives the engine deploy
    # key, so a moved tag would hand the private key to code nobody here
    # reviewed. The comment records which release the commit is.
    - uses: webfactory/ssh-agent@a6f90b1f127823b31d4d4a8d96047790581349bd  # v0.9.1
      if: inputs.deploy-key != ''
      with:
        ssh-private-key: ${{ inputs.deploy-key }}

    - name: Fetch deki-engine
      shell: bash
      env:
        HAVE_KEY: ${{ inputs.deploy-key != '' }}
      run: |
        if [ "$HAVE_KEY" = "true" ]; then
          git config --global url."git@github.com:dekiengine/deki-engine.git".insteadOf "https://github.com/dekiengine/deki-engine.git"
        else
          echo "No DEKI_ENGINE_DEPLOY_KEY secret: fetching the submodule over HTTPS"
        fi
        git submodule sync --recursive
        git submodule update --init --recursive --depth=1
        git -C deki-engine log --oneline -1
