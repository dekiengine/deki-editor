# Check out deki-editor with its deki-engine submodule, over plain HTTPS: both
# are public.

name: Checkout with engine
description: actions/checkout plus the deki-engine submodule

inputs:
  ref:
    description: "Ref to check out (default: the workflow's ref)"
    required: false
    default: ''

runs:
  using: composite
  steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref }}
        submodules: false

    - name: Fetch deki-engine
      shell: bash
      run: |
        git submodule sync --recursive
        git submodule update --init --recursive --depth=1
        git -C deki-engine log --oneline -1
