# Builds the Linux build image (tools/ci/docker/linux-build/Dockerfile) and
# pushes it to GitHub's container registry, where the Linux jobs of ci.yml and
# release.yml run in it.
#
# Runs when the Dockerfile or the PPA script changes on master, and by hand
# (Actions > Build image > Run workflow). A PPA outage delays a new image, never
# this repository's CI or a release. The package repositories cannot pull this
# private image, so their jobs (package-tests.yml, the Tactility firmware build)
# still install GCC from the PPA.

name: Build image

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - tools/ci/docker/linux-build/**
      - tools/ci/add_toolchain_ppa.sh
      - .github/workflows/build-image.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/dekiengine/deki-linux-build
  # Bumped with every change to what the image installs; ci.yml and
  # release.yml name this tag, so a job never runs in an image it was not
  # written for.
  IMAGE_TAG: "1"

jobs:
  linux-build:
    name: Linux build image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: tools/ci
          file: tools/ci/docker/linux-build/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE }}:latest
