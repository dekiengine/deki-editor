# Deki Editor CI.
#
# Two supported targets, one job each: build the editor, build and run the two
# test binaries, and run the repository's own consistency checks
# (tools/ci/check_version.py, tools/ci/check_abi.py, the Python tool tests).
#
# The "smoke" jobs go one step further and do what a user does: create a
# project, build it (packages cloned from the public registry, compiled with
# the same GCC), verify its scene and render it, and compare the pixel hash to
# tools/ci/golden-scaffold.txt. That is a cold build of several packages, so
# it runs on pull requests, tags and manual dispatch rather than on every push.
#
# The "demo" jobs do the same with deki-demo on every board it targets: its
# renders against tools/ci/golden-demo.txt, and nightly its firmware.
#
# GCC 16 is a hard requirement (C++26 reflection for the codegen); the jobs
# fail fast when the toolchain they installed is older.

name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSES/**'
  pull_request:
    branches: [master]
  # Nightly: the demo's board checks and firmware builds (see demo-boards).
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Least privilege, set here rather than inherited: the repository or org
# default can be read-write on every scope, and nothing in this workflow
# writes to the repository. The release workflow asks for more, where it
# needs it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CMAKE_BUILD_TYPE: Release

jobs:
  # ---------------------------------------------------------------------------
  windows:
    name: Windows (MinGW GCC 16)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      SCCACHE_DIR: ${{ github.workspace }}\.sccache
    steps:
      # actions/checkout first: a local composite action only exists once the tree is there.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/checkout-with-engine
        with:
          deploy-key: ${{ secrets.DEKI_ENGINE_DEPLOY_KEY }}

      # DekiRenderingTests compiles deki-rendering's own tests; it looks for
      # the package beside the editor checkout (DEKI_PACKAGES_DIR defaults to
      # ../packages) and silently skips when it is not there.
      # actions/checkout only writes inside the workspace, so these are plain
      # clones; the packages are public. The three in ../templates ship the
      # platform templates PlatformTemplateTests reads; apart from ../packages,
      # where every package is compiled and would need its requirements too.
      - name: Check out packages the tests read
        shell: bash
        run: |
          git clone --quiet --depth 1 https://github.com/dekiengine/deki-rendering ../packages/deki-rendering
          for p in deki-desktop-integration deki-lilygo-boards deki-tactility-integration; do
            git clone --quiet --depth 1 "https://github.com/dekiengine/$p" "../templates/$p"
          done

      # The runner image ships MSYS2 at C:\msys64, which is where the editor's
      # CMakeLists looks for g++ (see the top of CMakeLists.txt); release: false
      # keeps that location and only updates the packages.
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            git

      - name: Toolchain check (GCC 16)
        run: |
          g++ --version | head -n1
          ver=$(g++ -dumpfullversion)
          case "$ver" in
            16.*|1[7-9].*|[2-9][0-9].*) ;;
            *) echo "::error::GCC 16 required for the reflection codegen, got $ver"; exit 1 ;;
          esac
          cmake --version | head -n1
          python --version

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            !build/_deps/*-build
          key: deps-windows-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Cache sccache
        uses: actions/cache@v4
        with:
          path: .sccache
          key: sccache-windows-${{ github.sha }}
          restore-keys: sccache-windows-

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE -DDEKI_TEMPLATE_PACKAGES_DIR=${{ github.workspace }}/../templates

      - name: Build editor
        run: cmake --build build --target DekiEditor

      - name: Build tests
        run: cmake --build build --target DekiEditorTests DekiRenderingTests

      - name: Editor tests
        run: ./build/bin/DekiEditorTests.exe --gtest_brief=1

      - name: Rendering tests
        run: ./build/bin/DekiRenderingTests.exe --gtest_brief=1

      - name: Version consistency
        run: python tools/ci/check_version.py

      - name: ABI lock
        run: python tools/ci/check_abi.py

      - name: Python tool tests
        run: |
          python -m unittest discover -s tools/docs/tests
          if [ -d tools/tests ]; then python -m unittest discover -s tools/tests; fi

      - name: sccache stats
        if: always()
        run: ./build/bin/sccache.exe --show-stats || true

      - name: Editor log on failure
        if: failure()
        run: cat "$APPDATA/DekiEditor/Editor.log" 2>/dev/null || true

      - name: Upload editor build
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: editor-windows
          # The sources the editor fetched: a project build compiles against
          # them (DEKI_DEPS_DIR, <editor>/build/_deps).
          path: |
            build/bin
            build/_deps/*-src
          retention-days: 3

  # ---------------------------------------------------------------------------
  linux:
    name: Linux (GCC 16)
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout first: a local composite action only exists once the tree is there.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/checkout-with-engine
        with:
          deploy-key: ${{ secrets.DEKI_ENGINE_DEPLOY_KEY }}

      - name: Check out packages the tests read
        run: |
          git clone --quiet --depth 1 https://github.com/dekiengine/deki-rendering ../packages/deki-rendering
          for p in deki-desktop-integration deki-lilygo-boards deki-tactility-integration; do
            git clone --quiet --depth 1 "https://github.com/dekiengine/$p" "../templates/$p"
          done

      - name: Install toolchain and SDL3 build dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-16 gcc-16 cmake ninja-build ccache git curl pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxss-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libasound2-dev libpulse-dev \
            libdbus-1-dev libudev-dev xvfb

      - name: Toolchain check (GCC 16)
        run: |
          g++-16 --version | head -n1
          ver=$(g++-16 -dumpfullversion)
          case "$ver" in
            16.*|1[7-9].*|[2-9][0-9].*) ;;
            *) echo "::error::GCC 16 required for the reflection codegen, got $ver"; exit 1 ;;
          esac

      - name: Cache FetchContent sources
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            !build/_deps/*-build
          key: deps-linux-${{ hashFiles('CMakeLists.txt', 'tests/CMakeLists.txt') }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE
          -DCMAKE_C_COMPILER=gcc-16 -DCMAKE_CXX_COMPILER=g++-16 -DDEKI_TEMPLATE_PACKAGES_DIR=${{ github.workspace }}/../templates
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build editor
        run: cmake --build build --target DekiEditor

      - name: Build tests
        run: cmake --build build --target DekiEditorTests DekiRenderingTests

      - name: Editor tests
        run: ./build/bin/DekiEditorTests --gtest_brief=1

      - name: Rendering tests
        run: ./build/bin/DekiRenderingTests --gtest_brief=1

      - name: Version consistency
        run: python3 tools/ci/check_version.py

      - name: ABI lock
        run: python3 tools/ci/check_abi.py

      - name: Python tool tests
        run: |
          python3 -m unittest discover -s tools/docs/tests
          if [ -d tools/tests ]; then python3 -m unittest discover -s tools/tests; fi

      - name: ccache stats
        if: always()
        run: ccache -s

      - name: Editor log on failure
        if: failure()
        run: cat ~/.deki-editor/Editor.log ~/.config/DekiEditor/Editor.log 2>/dev/null || true

      - name: Upload editor build
        if: github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: editor-linux
          path: |
            build/bin
            build/lib
            build/_deps/*-src
          retention-days: 3

  # ---------------------------------------------------------------------------
  # What a user does: a new project, built from the registry, verified and
  # rendered. The hash must match tools/ci/golden-scaffold.txt on both
  # platforms; a change to the scaffold scene or to rendering updates that
  # file in the same commit and says so.
  smoke-windows:
    name: Project smoke (Windows)
    needs: windows
    if: github.event_name != 'push'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      # actions/checkout first: a local composite action only exists once the tree is there.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/checkout-with-engine
        with:
          deploy-key: ${{ secrets.DEKI_ENGINE_DEPLOY_KEY }}
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          release: false
          update: true
          path-type: inherit
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja git
      - uses: actions/download-artifact@v4
        with:
          name: editor-windows
          path: build
      - name: New project, build, verify, render
        run: |
          set -e
          parent="$RUNNER_TEMP/smoke"
          mkdir -p "$parent"
          ./build/bin/DekiEditor.exe --new-project ci-smoke "$parent"
          ./build/bin/DekiEditor.exe --build-code "$parent/ci-smoke"
          ./build/bin/DekiEditor.exe --verify-scenes "$parent/ci-smoke"
          ./build/bin/DekiEditor.exe --render-scenes "$parent/ci-smoke" | tee render.txt
          python tools/ci/check_golden.py render.txt tools/ci/golden-scaffold.txt
      - name: Editor log on failure
        if: failure()
        run: cat "$APPDATA/DekiEditor/Editor.log" 2>/dev/null || true

  smoke-linux:
    name: Project smoke (Linux)
    needs: linux
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout first: a local composite action only exists once the tree is there.
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/checkout-with-engine
        with:
          deploy-key: ${{ secrets.DEKI_ENGINE_DEPLOY_KEY }}
      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-16 gcc-16 cmake ninja-build git curl xvfb libgl1-mesa-dev
      - uses: actions/download-artifact@v4
        with:
          name: editor-linux
          path: build
      - name: New project, build, verify, render
        run: |
          set -e
          chmod +x build/bin/DekiEditor
          export LD_LIBRARY_PATH="$PWD/build/lib:$PWD/build/bin"
          parent="$RUNNER_TEMP/smoke"
          mkdir -p "$parent"
          xvfb-run -a ./build/bin/DekiEditor --new-project ci-smoke "$parent"
          xvfb-run -a ./build/bin/DekiEditor --build-code "$parent/ci-smoke"
          xvfb-run -a ./build/bin/DekiEditor --verify-scenes "$parent/ci-smoke"
          xvfb-run -a ./build/bin/DekiEditor --render-scenes "$parent/ci-smoke" | tee render.txt
          python3 tools/ci/check_golden.py render.txt tools/ci/golden-scaffold.txt
      - name: Editor log on failure
        if: failure()
        run: cat ~/.deki-editor/Editor.log ~/.config/DekiEditor/Editor.log 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # deki-demo on every board it targets, against the editor, engine and
  # packages on master. Each board renders the demo at its own screen size and
  # colour format, and the hashes must match that board's block in
  # tools/ci/golden-demo.txt. deki-demo is private: it is checked out with a
  # read-only deploy key (DEKI_DEMO_DEPLOY_KEY, set up like the engine's, see
  # .github/actions/checkout-with-engine). A pull request from a fork gets no
  # secrets, so it cannot read the demo and skips this job.
  demo-boards:
    name: Demo on every board (Linux)
    needs: linux
    if: >-
      github.event_name != 'push' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/checkout-with-engine
        with:
          deploy-key: ${{ secrets.DEKI_ENGINE_DEPLOY_KEY }}
      # Without the agent the engine checkout left running: ssh would offer
      # the engine's key first, GitHub would take it, and deki-demo would read
      # as "not found".
      - uses: actions/checkout@v4
        env:
          SSH_AUTH_SOCK: ''
        with:
          repository: dekiengine/deki-demo
          ssh-key: ${{ secrets.DEKI_DEMO_DEPLOY_KEY }}
          path: ci/deki-demo
      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-16 gcc-16 cmake ninja-build git curl xvfb libgl1-mesa-dev
      - uses: actions/download-artifact@v4
        with:
          name: editor-linux
          path: build
      - name: Packages at master
        run: python3 tools/ci/link_demo_packages.py ci/deki-demo ci/packages
      - name: Build, verify, render every board
        run: |
          set -e
          chmod +x build/bin/DekiEditor
          export LD_LIBRARY_PATH="$PWD/build/lib:$PWD/build/bin"
          xvfb-run -a ./build/bin/DekiEditor --build-code ci/deki-demo
          xvfb-run -a ./build/bin/DekiEditor --verify-scenes ci/deki-demo
          for board in $(ls ci/deki-demo/platforms); do
            echo "=== $board"
            xvfb-run -a ./build/bin/DekiEditor --render-scenes --platform "$board" ci/deki-demo | tee "render-$board.txt"
            python3 tools/ci/check_golden.py "render-$board.txt" tools/ci/golden-demo.txt
          done
      - name: Editor log on failure
        if: failure()
        run: cat ~/.deki-editor/Editor.log ~/.config/DekiEditor/Editor.log 2>/dev/null || true

  # Firmware for every board deki-demo targets. ESP-IDF is several GB and a
  # cold firmware build takes minutes, so this runs nightly and on demand only.
  demo-firmware:
    name: Demo firmware (Linux)
    needs: linux
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: ./.github/actions/checkout-with-engine
        with:
          deploy-key: ${{ secrets.DEKI_ENGINE_DEPLOY_KEY }}
      # Without the agent the engine checkout left running: ssh would offer
      # the engine's key first, GitHub would take it, and deki-demo would read
      # as "not found".
      - uses: actions/checkout@v4
        env:
          SSH_AUTH_SOCK: ''
        with:
          repository: dekiengine/deki-demo
          ssh-key: ${{ secrets.DEKI_DEMO_DEPLOY_KEY }}
          path: ci/deki-demo
      - name: Install toolchain
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-16 gcc-16 cmake ninja-build git curl xvfb \
            libgl1-mesa-dev python3-venv libusb-1.0-0
      - uses: actions/download-artifact@v4
        with:
          name: editor-linux
          path: build
      - name: Packages at master
        run: python3 tools/ci/link_demo_packages.py ci/deki-demo ci/packages
      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: ~/.deki-editor/toolchains
          key: esp-idf-linux-${{ hashFiles('ci/packages/deki-esp32-integration/editor/ESPIDFToolchain.cpp') }}
      - name: Build firmware for every board
        run: |
          set -e
          chmod +x build/bin/DekiEditor
          export LD_LIBRARY_PATH="$PWD/build/lib:$PWD/build/bin"
          xvfb-run -a ./build/bin/DekiEditor --install-toolchain esp-idf --platform lilygo_t_deck_plus ci/deki-demo
          for board in $(ls ci/deki-demo/platforms); do
            [ "$board" = native_simulator ] && continue
            echo "=== $board"
            xvfb-run -a ./build/bin/DekiEditor --build-firmware --platform "$board" ci/deki-demo
          done
      - name: Editor log on failure
        if: failure()
        run: cat ~/.deki-editor/Editor.log ~/.config/DekiEditor/Editor.log 2>/dev/null || true
