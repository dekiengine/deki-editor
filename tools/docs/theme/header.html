<script type="text/javascript">
/* The docs have two halves, each with its own tab and sidebar. Set before the
   page draws, so the sidebar does not flash the other half. deki.css does the
   rest from this attribute. */
(function () {
  var page = location.pathname.split('/').pop();
  var api = /^(annotated|classes|hierarchy|inherits|functions|namespace|class_|struct_|union_|dir_)|_8h|-members/;
  document.documentElement.setAttribute('data-deki-tab', api.test(page) ? 'api' : 'manual');
})();
</script>

<script type="text/javascript">
/* Pressing a group in the sidebar opens the page and its list too. The tree is
   built after load, hence the retries. */
window.addEventListener('load', function () {
  var tries = 0;
  var timer = setInterval(function () {
    var closed = document.querySelector('#nav-tree-contents .selected .arrowhead.closed');
    if (closed) {
      closed.closest('a').click();
    }
    if (closed || ++tries > 30) {
      clearInterval(timer);
    }
  }, 100);
});
</script>
